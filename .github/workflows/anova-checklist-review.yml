# Unit tests for anova-checklist-review (no Docker required).
name: anova-checklist-review

on:
  push:
    branches:
      - "cursor/**"
      - master
    paths:
      - "anova-checklist-review/**"
      - "docs/**"
      - ".github/workflows/anova-checklist-review.yml"
  pull_request:
    branches:
      - master
    paths:
      - "anova-checklist-review/**"
      - "docs/**"
      - ".github/workflows/anova-checklist-review.yml"
  # Allow manual re-run from the Actions tab
  workflow_dispatch:

concurrency:
  group: acr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: backend-unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anova-checklist-review/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: anova-checklist-review/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        env:
          WORKER_ENABLED: "false"
          AUTH_MODE: open
          UPLOAD_DIR: /tmp/acr-test-uploads
          EXPORT_DIR: /tmp/acr-test-exports
        run: pytest -q

      - name: Preflight isolation (skip docker)
        working-directory: anova-checklist-review
        env:
          # CI runners vary; isolation file checks matter more than host RAM here
          PREFLIGHT_MIN_RAM_GB: "1"
          PREFLIGHT_MIN_DISK_GB: "1"
        run: python3 scripts/preflight_check.py --skip-docker

      - name: Registry honesty check
        working-directory: anova-checklist-review/backend
        run: |
          python3 - <<'PY'
          from app.services.checklist_catalog import registry_public_view
          v = registry_public_view()
          assert v["counts"]["claimed_production_template_count"] == 0
          print("registry ok:", v["counts"])
          PY

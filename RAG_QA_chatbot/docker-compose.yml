services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    image: rag_qa_chatbot-backend
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      # Use the local Qdrant container unless .env points elsewhere
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    ports:
      - "8000:8000"
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # One-off: docker compose run --rm ingest --source /docs --base-url https://docs.example.com --recreate
  ingest:
    image: rag_qa_chatbot-backend  # reuses the backend image
    env_file: .env
    environment:
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
    volumes:
      - ./docs:/docs:ro
    entrypoint: ["python", "-m", "ingest.run"]
    profiles: ["tools"]
    depends_on:
      - qdrant

volumes:
  qdrant_data:
